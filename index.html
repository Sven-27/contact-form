<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link href="./styles.css" rel="stylesheet" type="text/css" />
    <title>Contact form</title>
  </head>
  <body>
    <div class="submit-message">
      <span class="text-preset-2">
        <img src="./assets/images/icon-success-check.svg" alt="ïcon for a succes check" />  
        Message Sent!
      </span>
      <p class="text-preset-4">Thanks for completing the form. We'll be in touch soon!</p>
    </div>
    <form>
      <h1 class="text-preset-1">Contact Us</h1>
      <div class="input-fields name-container-1">
        <label
           for="firstname"
           class="text-preset-4"
        >
          First Name 
          <span>*</span>  
        </label>
        <input
          id="firstname"
          type="text"
          name="firstname"
          class="personal-info text-preset-3"
          aria-describedby="firstname-error"
          required
          aria-required="true"
        />
      <p id="firstname-error" class="error text-preset-4">This field is required</p>
      </div>
      <div class="input-fields name-container-2">
        <label 
          for="lastname"
          class="text-preset-4"
        >
          Last Name 
          <span>*</span>
        </label>
        <input
          id="lastname"
          type="text"
          name="lastname"
          class="personal-info text-preset-3"
          aria-describedby="lastname-error"
          required
          aria-required="true"
        />
        <p id="lastname-error" class="error text-preset-4">This field is required</p>
      </div>
      <div class="input-fields">
        <label 
          for="email"
          class="text-preset-4"
        >
          Email Address 
         <span>*</span>
        </label>
        <input
          id="email"
          type="email"
          name="email"
          class="personal-info text-preset-3 input-email"
          aria-describedby="email-error"
          required
          aria-required="true"
          autocomplete="true"
        />
        <p id="email-error" class="error text-preset-4">Please enter a valid email address</p>
      </div>
      <fieldset class="input-fields choice-container">
        <legend class="text-preset-4">Query Type <span>*</span></legend>
        <div class="choice">
          <input
            id="general"
            type="radio"
            name="query-type"
            value="General Enquiry"
            
            aria-describedby="query-error"
          />
          <label 
            for="general"
            class="text-preset-3"
          >
            General Enquiry
          </label>
        </div>
        <div class="choice">
          <input
            id="support"
            type="radio"
            name="query-type"
            value="Support Request"
            aria-describedby="query-error"
          />
          <label 
            for="support"
            class="text-preset-3"
          >
            Support Request
          </label>
        </div>
        <p id="query-error" class="error text-preset-4">Please select a query type Message</p>
      </fieldset>
      <div class="input-fields">
        <label 
          for="message"
          class="text-preset-4"
        > Message 
        <span>*</span>
      </label>
        <textarea 
          id="message"
          name="message"
          class="text-preset-3"
          aria-describedby="message-error"
        ></textarea>
        <p id="message-error" class="error text-preset-4">This field is required</p>
      </div>
      <div class="check-field">
        <input 
          type="checkbox" 
          id="accept" 
          name="accept" 
          aria-describedby="accept-error"
        />
        <label 
          for="accept"
          class="text-preset-4"
        >
          I consent to being contacted by the team 
          <span>*</span>
        </label>
      </div>
      <p id="accept-error" class="error text-preset-4">To submit this form, please consent to being contacted</p>
      <button 
        type="submit"
        class="text-preset-2"
      >
        Submit
      </button>
    </form>
    <script src="./script.js"></script>
  </body>
</html>
