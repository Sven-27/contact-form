<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link href="./styles.css" rel="stylesheet" type="text/css" />
    <title>Contact form</title>
  </head>
  <body>
    <p> Message Sent! Thanks for completing the form. We'll be in touch soon!</p>
    <forn>
      <h1>Contact Us</h1>
      <div>
        <label for="firstname">First Name <span>*</span></label>
        <input
          id="firstname"
          type="text"
          name="firstname"
          class="personal-info"
          aria-describedby="firstname-error"
          required
          aria-required="true"
        />
        <p id="firstname-error" class="error">This field is required</p>
      </div>
      <div>
        <label for="lastname">Last Name <span>*</span></label>
        <input
          id="lastname"
          type="text"
          name="lastname"
          class="personal-info"
          aria-describedby="lastname-error"
          required
          aria-required="true"
        />
        <p id="lastname-error" class="error">This field is required</p>
      </div>
      <div>
        <label for="email">Email Address <span>*</span></label>
        <input
          id="email"
          type="text"
          name="email"
          class="personal-info"
          aria-describedby="email-error"
          required
          aria-required="true"
        />
        <p id="email-error" class="error">Please enter a valid email address</p>
      </div>
      <fieldset>
        <legend>Query Type <span>*</span></legend>
        <div>
          <input
            id="general"
            type="radio"
            name="general"
            value="General Enquiry"
            checked
            aria-describedby="query-error"
          />
          <label for="general">General Enquiry</label>
        </div>
        <div>
          <input
            id="support"
            type="radio"
            name="support"
            value="Support Request"
            aria-describedby="query-error"
          />
          <label for="support">Support Request</label>
        </div>
        <p id="query-error" class="error">Please select a query type Message</p>
      </fieldset>
      <div>
        <label for="message">Message <span>*</span></label>
        <textarea 
          id="message"
          name="message"
          aria-describedby="message-error"
        ></textarea>
        <p id="message-error" class="error">This field is required</p>
      </div>
      <div>
        <input 
          type="checkbox" 
          id="accept" 
          name="accept" 
          aria-describedby="accept-error"
        />
        <label for="accept">I consent to being contacted by the team <span>*</span></label>
        <p id="accept-error" class="error">To submit this form, please consent to being contacted</p>
      </div>
      <button type="submit">Submit</button>
    </forn>
  </body>
</html>
